<!doctype html>
<!-- The link preview picture (Discord, Twitter...): rendered to img/og.png at 1200x630 with headless Edge.
     Not linked from the site; only used to make the picture. -->
<html>
<head>
<meta charset="utf-8">
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; color: #f5f5f7; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
	.card { position: relative; width: 1200px; height: 630px; padding: 64px 0 64px 72px; display: flex; gap: 48px; }
	.left { width: 560px; display: flex; flex-direction: column; justify-content: center; }
	.who { display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 700; }
	.who img { width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 3px #1f1f23; }
	h1 { margin-top: 26px; font-size: 76px; line-height: 0.98; letter-spacing: -0.04em; font-weight: 700; }
	.kicker { margin-top: 26px; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8e8e93; }
	.focus { margin-top: 10px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
	.open { margin-top: 26px; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px 10px 14px; border-radius: 999px;
		font-size: 19px; font-weight: 700; color: #30d158; background: rgba(48, 209, 88, 0.12); box-shadow: inset 0 0 0 1px rgba(48, 209, 88, 0.3); }
	.open i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
	.shots { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 14px; transform: rotate(-4deg) translate(18px, -6px); margin-right: -120px; }
	.shots img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6); }
	.fade { position: absolute; inset: 0; background: linear-gradient(90deg, #000 45%, rgba(0, 0, 0, 0) 62%); pointer-events: none; }
	.left { position: relative; z-index: 2; }
</style>
</head>
<body>
	<div class="card">
		<div class="left">
			<div class="who"><img src="img/avatar.webp" alt="">netablade</div>
			<h1>netablade's<br>portfolio</h1>
			<p class="kicker">Roblox scripting & UI · 4 years of experience</p>
			<p class="focus">UI, combat, shops & data systems</p>
			<span class="open"><i></i>Commissions open</span>
		</div>
		<div class="shots">
			<img src="videos/combat-and-battlegrounds/lock-on-system.jpg" alt="">
			<img src="videos/pets-and-rng/cinematic-gun-skin-spin.jpg" alt="">
			<img src="videos/pets-and-rng/egg-hatching.jpg" alt="">
			<img src="videos/guns-and-shooter/running-and-shooting.jpg" alt="">
			<img src="videos/combat-and-battlegrounds/finisher-cutscene.jpg" alt="">
			<img src="videos/ui-and-systems/pass-shop-gifting.jpg" alt="">
		</div>
		<div class="fade"></div>
	</div>
</body>
</html>
